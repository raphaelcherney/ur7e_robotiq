# Gripper controllers, loaded on top of ur_robot_driver's own controllers (ur_controllers.yaml).

# Open/close the gripper.
# Action server: /robotiq_gripper_controller/gripper_cmd (control_msgs/action/ParallelGripperCommand)
# Joint position: 0.0 = fully open, ~0.79 = fully closed.
robotiq_gripper_controller:
  ros__parameters:
    type: parallel_gripper_action_controller/GripperActionController
    joint: robotiq_85_left_knuckle_joint
    state_interfaces: [position, velocity]
    goal_tolerance: 0.02
    allow_stalling: true
    stall_timeout: 2.0  # a full open/close stroke takes ~1 s

# Re-activate the gripper (e.g. after a fault) with:
#   ros2 service call /robotiq_activation_controller/reactivate_gripper std_srvs/srv/Trigger
robotiq_activation_controller:
  ros__parameters:
    type: robotiq_controllers/RobotiqActivationController

# Real robot only: publishes the gripper joint on /joint_states. (The main joint_state_broadcaster
# starts before the gripper hardware is active, so it doesn't include the gripper.)
gripper_joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster
    joints: [robotiq_85_left_knuckle_joint]
    interfaces: [position, velocity]
